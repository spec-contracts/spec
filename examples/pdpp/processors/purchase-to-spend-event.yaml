$schema: ../../../schemas/v0/processor.schema.json
spec: "0.1-alpha"
kind: Processor
address: SPECX:PURCHASE-TO-SPEND-EVENT@1
namespace_id: 42acea42-ed1b-4455-86b1-84ca5cbfc7d2
family_id: d6c3882c-f74a-4c84-b8f5-d2952f81855a
version_id: 6aa8921c-aa87-45bb-afaf-4fbc39d30ab4
version: "1"
description: Derive one SpendEvent from one shared Purchase.
definition:
  body: >-
    Copy occurrence time, normalized amount, optional merchant, and source
    reference from SPECX:PURCHASE@1 into SPECX:SPEND-EVENT@1. This boundary
    has no knowledge of Amazon, DoorDash, Shop, or any source representation.
inputs:
  - name: purchase
    contract: SPECX:PURCHASE@1
    contract_version_id: cf44e72f-08af-4c7b-a732-68c8078352d4
    bindings:
      - SPECX:PURCHASE@1:JSON@1
outputs:
  - name: spend_event
    contract: SPECX:SPEND-EVENT@1
    contract_version_id: 7d21db84-7b15-4e41-a761-6bae2b3808f9
    bindings:
      - SPECX:SPEND-EVENT@1:JSON@1
state: []
effects:
  safe: true
  idempotent: true
  open_world: false

