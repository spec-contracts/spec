$schema: ../../../schemas/v0/processor.schema.json
spec: "0.1-alpha"
kind: Processor
address: SPECX:PDPP-AMAZON-TO-PURCHASE@1
namespace_id: 42acea42-ed1b-4455-86b1-84ca5cbfc7d2
family_id: f95988e0-7c70-4d64-be96-01ea9194919e
version_id: d091e1be-4949-4932-bd4f-6535a20b83b9
version: "1"
description: Normalize one synthetic Amazon order into a shared Purchase.
definition:
  body: >-
    Map Amazon order identity, purchase time, status, currency, total, merchant,
    and source reference into SPECX:PURCHASE@1. Convert decimal total to exact
    integer minor units according to the declared currency.
inputs:
  - name: order
    contract: SPECX:PDPP-AMAZON-ORDERS@1
    contract_version_id: 1fe4eb16-ae6b-4f9b-8ae7-8ac5bd7a2b33
    bindings:
      - SPECX:PDPP-AMAZON-ORDERS@1:JSON@1
outputs:
  - name: purchase
    contract: SPECX:PURCHASE@1
    contract_version_id: cf44e72f-08af-4c7b-a732-68c8078352d4
    bindings:
      - SPECX:PURCHASE@1:JSON@1
state: []
effects:
  safe: true
  idempotent: true
  open_world: false

