    contract: SPECX:PDPP-SHOP-ORDERS@1
    contract_version_id: 63ee33bd-eb06-4aca-b09e-65cacdba0d46
    bindings:
      - SPECX:PDPP-SHOP-ORDERS@1:JSON@1
outputs:
  - name: purchase
    contract: SPECX:PURCHASE@1
    contract_version_id: cf44e72f-08af-4c7b-a732-68c8078352d4
    bindings:
      - SPECX:PURCHASE@1:JSON@1
state: []
effects:
  safe: true
  idempotent: true
  open_world: false

