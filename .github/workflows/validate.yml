name: Validate SPEC

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  descriptors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate.py
      - run: python tools/test_conformance.py
      - name: Run and verify draft conformance suite
        run: |
          python tools/conformance.py run --output "$RUNNER_TEMP/spec-conformance-report.json"
          python tools/conformance.py verify-report "$RUNNER_TEMP/spec-conformance-report.json"
          python tools/conformance.py audit-requirements
